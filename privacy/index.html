<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kaisku privacy information">
    <title>Privacy — Kaisku</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%3Cpath%20fill%3D%22%23090908%22%20d%3D%22M32%202C20%202%2013%209%2011%2020c-2%208-1%2016%202%2022%202%204%201%208-2%2011-2%202-4%203-5%205-2%203%203%204%206%205%206%202%2013%202%2020%202s14%200%2020-2c3-1%208-2%206-5-1-2-3-3-5-5-3-3-4-7-2-11%203-6%204-14%202-22C51%209%2044%202%2032%202z%22%2F%3E%0A%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M36%2021c4-2%209-1%2012%201-2%205-6%207-11%205-2-1-3-3-1-6z%22%2F%3E%0A%3Cellipse%20cx%3D%2232%22%20cy%3D%2235%22%20rx%3D%226%22%20ry%3D%223.5%22%20fill%3D%22%23ffffff%22%2F%3E%0A%3C%2Fsvg%3E">

    <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #f1ecdf;
            --ink: #090908;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.075;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
            mix-blend-mode: multiply;
        }

        main {
            width: min(720px, calc(100% - 44px));
            margin: 0 auto;
            padding: 11vh 0 80px;
        }

        .wordmark {
            margin: 0 0 42px;
            font-family: "Grenze Gotisch", Georgia, serif;
            font-size: clamp(54px, 8vw, 92px);
            font-weight: 700;
            line-height: .9;
            letter-spacing: -0.04em;
        }

        h1 {
            margin: 0 0 38px;
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 400;
            letter-spacing: -0.035em;
        }

        h2 {
            margin: 0 0 10px;
            font-size: 18px;
            font-weight: 700;
        }

        p {
            margin: 0 0 8px;
            font-size: 17px;
            line-height: 1.5;
        }

        a {
            color: inherit;
        }

        .back {
            display: inline-block;
            margin-top: 50px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .13em;
            text-decoration: none;
            border-bottom: 1px solid var(--ink);
            padding-bottom: 3px;
        }
    </style>
</head>
<body>
    <main>
        <div class="wordmark">Kaisku</div>
        <h1>Privacy</h1>

        <section>
            <h2>Data controller</h2>
            <p>Jorma Paloheinä, operating under the name Kaisku</p>
            <p>Contact: <a href="mailto:hello@kaisku.com">hello@kaisku.com</a></p>
        </section>

        <a class="back" href="/">Back to Kaisku</a>
    </main>
</body>
</html>
