<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kaisku">
    <title>Kaisku</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%3Cpath%20fill%3D%22%23090908%22%20d%3D%22M32%202C20%202%2013%209%2011%2020c-2%208-1%2016%202%2022%202%204%201%208-2%2011-2%202-4%203-5%205-2%203%203%204%206%205%206%202%2013%202%2020%202s14%200%2020-2c3-1%208-2%206-5-1-2-3-3-5-5-3-3-4-7-2-11%203-6%204-14%202-22C51%209%2044%202%2032%202z%22%2F%3E%0A%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M36%2021c4-2%209-1%2012%201-2%205-6%207-11%205-2-1-3-3-1-6z%22%2F%3E%0A%3Cellipse%20cx%3D%2232%22%20cy%3D%2235%22%20rx%3D%226%22%20ry%3D%223.5%22%20fill%3D%22%23ffffff%22%2F%3E%0A%3C%2Fsvg%3E">

    <link
        href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --paper: #f1ecdf;
            --ink: #090908;

            --wave-1: rgba(9, 9, 8, 0.13);
            --wave-2: rgba(9, 9, 8, 0.25);
            --wave-3: rgba(9, 9, 8, 0.44);
            --wave-4: rgba(9, 9, 8, 0.97);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            background: var(--paper);
            color: var(--ink);

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }

        .page {
            position: relative;

            width: 100%;
            min-height: 100vh;

            overflow: hidden;
        }


        /* ========================================
           PAPER TEXTURE
        ======================================== */

        .paper-noise {
            position: absolute;
            inset: 0;

            z-index: 50;
            pointer-events: none;

            opacity: 0.075;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");

            mix-blend-mode: multiply;
        }


        /* ========================================
           MAIN CONTENT
        ======================================== */

        .content {
            position: absolute;

            z-index: 30;

            left: 6vw;
            top: 33vh;

            width: min(46vw, 720px);
        }


        /* ========================================
           KAISKU WORDMARK
        ======================================== */

        .wordmark {
            display: block;

            width: min(630px, 45vw);
            height: auto;

            overflow: visible;
        }

        .wordmark-text {
            font-family:
                "Grenze Gotisch",
                Georgia,
                serif;

            font-size: 166px;
            font-weight: 700;

            fill: var(--ink);

            letter-spacing: -5px;

            filter: url(#ink-distortion);
        }


        /* ========================================
           DIVIDER
        ======================================== */

        .rule {
            width: 86px;
            height: 9px;

            margin-top: 14px;
            margin-bottom: 30px;

            background: var(--ink);
        }


        /* ========================================
           COPY
        ======================================== */

        .copy {
            max-width: 430px;

            font-size:
                clamp(
                    17px,
                    1.25vw,
                    22px
                );

            line-height: 1.36;
            letter-spacing: -0.018em;
        }


        /* ========================================
           SIGNUP
        ======================================== */

        .signup-block {
            margin-top: 46px;
            max-width: 460px;
        }

        .signup-copy {
            margin-bottom: 17px;

            font-size:
                clamp(
                    18px,
                    1.32vw,
                    23px
                );

            line-height: 1.27;
            letter-spacing: -0.018em;
        }

        .signup-form {
            display: flex;
            align-items: stretch;
            gap: 8px;

            width: 100%;
            max-width: 460px;
        }

        .signup-input,
        .signup-submit {
            height: 44px;
            min-height: 44px;

            border: 1.5px solid var(--ink);
            border-radius: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 13px;
        }

        .signup-input {
            flex: 1 1 auto;
            min-width: 0;

            padding: 0 14px;

            background: rgba(255, 255, 255, 0.16);
            color: var(--ink);

            outline: none;
        }

        .signup-input::placeholder {
            color: rgba(9, 9, 8, 0.58);
        }

        .signup-input:focus {
            outline: 2px solid var(--ink);
            outline-offset: 2px;
        }

        .signup-submit {
            flex: 0 0 auto;

            padding: 0 18px;

            background: var(--ink);
            color: var(--paper);

            font-weight: 700;
            letter-spacing: 0.01em;

            cursor: pointer;
        }

        .signup-submit:hover,
        .signup-submit:focus-visible {
            opacity: 0.82;
        }

        .signup-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 9px;
        }

        .signup-meta a {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 9px;
            line-height: 1;

            color: rgba(9, 9, 8, 0.52);
            text-decoration: none;
            letter-spacing: 0.03em;
        }

        .signup-meta a:hover,
        .signup-meta a:focus-visible {
            color: var(--ink);
        }

        .signup-meta-separator {
            width: 1px;
            height: 9px;
            background: rgba(9, 9, 8, 0.22);
        }


        /* ========================================
           MYSTIC FORM
        ======================================== */

        .mystic-form {
            position: absolute;

            z-index: 4;

            right: 10vw;
            top: 13vh;

            width:
                clamp(
                    300px,
                    27vw,
                    520px
                );

            height: 68vh;

            display: flex;
            align-items: center;
            justify-content: center;

            animation:
                mysticFloat
                11s
                ease-in-out
                infinite
                alternate;
        }

        .mystic-form svg {
            display: block;

            width: 100%;
            height: 100%;

            overflow: visible;
        }

        /* ========================================
           EYE → FISH → MOUTH → EYE LOOP

           The visible right eye opening doubles as the fish body.
           A tail slowly grows out of it, the fish dives into the
           mouth, disappears, then swims back in from the mask's
           right edge and settles back into the eye opening.
        ======================================== */

        .fish-eye {
            transform-box: view-box;
            transform-origin: 214px 158px;
            animation:
                fishJourney
                24s
                ease-in-out
                infinite;
            will-change: transform, opacity;
        }

        .fish-eye-body {
            fill: var(--paper);
        }

        .fish-tail-wrap {
            transform-box: view-box;

            /*
               The reveal grows from a pivot point that sits well inside
               the eye-shaped fish body. This prevents any visual seam
               between body and tail while the tail appears/disappears.
            */
            transform-origin: 226px 159px;

            animation:
                fishTailReveal
                24s
                ease-in-out
                infinite;
        }

        .fish-tail {
            fill: var(--paper);

            /*
               Single-piece tail. Its root extends deep underneath the fish
               body, and the body is rendered on top of it. The tail therefore
               stays visually welded to the fish even while it flexes.
            */
            transform-box: view-box;
            transform-origin: 226px 159px;

            animation:
                fishTailWiggle
                0.9s
                ease-in-out
                infinite
                alternate;

            will-change: transform;
        }

        @keyframes fishJourney {

            /* Resting eye opening */
            0%,
            17% {
                opacity: 1;
                transform:
                    translate(0, 0)
                    rotate(0deg)
                    scale(1);
            }

            /* The eye has become a fish and starts moving */
            23% {
                opacity: 1;
                transform:
                    translate(0, 0)
                    rotate(-3deg)
                    scale(1);
            }

            /* Slow curved-feeling dive toward the mouth */
            36% {
                opacity: 1;
                transform:
                    translate(-24px, 38px)
                    rotate(-28deg)
                    scale(0.98);
            }

            49% {
                opacity: 1;
                transform:
                    translate(-50px, 82px)
                    rotate(-52deg)
                    scale(0.90);
            }

            /* Fish reaches the mouth and vanishes into it */
            55% {
                opacity: 0;
                transform:
                    translate(-55px, 92px)
                    rotate(-60deg)
                    scale(0.18);
            }

            /* Quiet pause while the eye opening is gone */
            66% {
                opacity: 0;
                transform:
                    translate(64px, 0)
                    rotate(0deg)
                    scale(0.78);
            }

            /* Reappears from the mask's right side at eye height */
            70% {
                opacity: 1;
                transform:
                    translate(58px, 0)
                    rotate(2deg)
                    scale(0.82);
            }

            80% {
                opacity: 1;
                transform:
                    translate(24px, -2px)
                    rotate(-2deg)
                    scale(0.92);
            }

            /* Settles back into the eye opening */
            89%,
            100% {
                opacity: 1;
                transform:
                    translate(0, 0)
                    rotate(0deg)
                    scale(1);
            }
        }

        @keyframes fishTailReveal {

            /* No tail: reads as the original eye opening */
            0%,
            15% {
                opacity: 0;
                transform: scaleX(0);
            }

            /* Tail grows, turning the eye into a fish */
            21%,
            55% {
                opacity: 1;
                transform: scaleX(1);
            }

            /* Hidden together with the fish */
            56%,
            66% {
                opacity: 0;
                transform: scaleX(1);
            }

            /* Tail is visible when the fish swims back in */
            70%,
            86% {
                opacity: 1;
                transform: scaleX(1);
            }

            /* Tail retracts and the fish becomes the eye again */
            93%,
            100% {
                opacity: 0;
                transform: scaleX(0);
            }
        }

        @keyframes fishTailWiggle {
            from {
                transform:
                    rotate(-3deg);
            }

            to {
                transform:
                    rotate(4deg);
            }
        }

        @keyframes mysticFloat {

            0% {
                transform:
                    translateY(-7px)
                    rotate(-0.6deg);
            }

            50% {
                transform:
                    translateY(5px)
                    rotate(0.25deg);
            }

            100% {
                transform:
                    translateY(-2px)
                    rotate(0.7deg);
            }
        }


        /* ========================================
           WAVES
        ======================================== */

        .waves {
            position: absolute;

            z-index: 9;

            left: 0;
            bottom: -2px;

            width: 100%;
            height: 19vh;

            overflow: hidden;

            pointer-events: none;
        }

        .wave-layer {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        .wave-track {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 200%;
            height: 100%;

            display: flex;

            will-change: transform;
        }

        .wave-copy {
            width: 50%;
            height: 100%;

            flex: 0 0 50%;
        }

        .wave-copy svg {
            display: block;

            width: 100%;
            height: 100%;
        }


        /* ========================================
           WAVE COLOURS
        ======================================== */

        .wave-a path {
            fill: var(--wave-1);
        }

        .wave-b path {
            fill: var(--wave-2);
        }

        .wave-c path {
            fill: var(--wave-3);
        }

        .wave-d path {
            fill: var(--wave-4);
        }


        /* ========================================
           CONTINUOUS WAVE MOVEMENT
        ======================================== */

        .wave-a .wave-track {
            animation:
                waveLeft
                23s
                linear
                infinite;
        }

        .wave-b .wave-track {
            animation:
                waveRight
                18s
                linear
                infinite;
        }

        .wave-c .wave-track {
            animation:
                waveLeft
                28s
                linear
                infinite;
        }

        .wave-d .wave-track {
            animation:
                waveRight
                21s
                linear
                infinite;
        }


        @keyframes waveLeft {

            from {
                transform:
                    translate3d(
                        0,
                        0,
                        0
                    );
            }

            to {
                transform:
                    translate3d(
                        -50%,
                        0,
                        0
                    );
            }
        }


        @keyframes waveRight {

            from {
                transform:
                    translate3d(
                        -50%,
                        0,
                        0
                    );
            }

            to {
                transform:
                    translate3d(
                        0,
                        0,
                        0
                    );
            }
        }


        /* Slight vertical movement */

        .wave-a {
            animation:
                floatA
                8s
                ease-in-out
                infinite
                alternate;
        }

        .wave-b {
            animation:
                floatB
                10s
                ease-in-out
                infinite
                alternate;
        }

        .wave-c {
            animation:
                floatC
                7s
                ease-in-out
                infinite
                alternate;
        }

        .wave-d {
            animation:
                floatD
                11s
                ease-in-out
                infinite
                alternate;
        }


        @keyframes floatA {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-6px);
            }
        }

        @keyframes floatB {
            from {
                transform: translateY(-3px);
            }

            to {
                transform: translateY(5px);
            }
        }

        @keyframes floatC {
            from {
                transform: translateY(3px);
            }

            to {
                transform: translateY(-5px);
            }
        }

        @keyframes floatD {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(4px);
            }
        }


        /* ========================================
           FOOTER
        ======================================== */

        .footer {
            position: absolute;

            z-index: 30;

            left: 24px;
            bottom: 21px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 8px;
            font-weight: 600;

            letter-spacing: 0.25em;

            text-transform: uppercase;

            color: var(--paper);
        }


        /* ========================================
           TABLET
        ======================================== */

        @media (max-width: 900px) {

            .content {
                left: 24px;
                top: 28vh;

                width: 72vw;
            }

            .wordmark {
                width: 68vw;
            }

            .wordmark-text {
                font-size: 150px;
            }

            .mystic-form {
                width: 44vw;
                height: 60vh;

                right: -3vw;
                top: 24vh;
            }

            .waves {
                height: 18vh;
            }
        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 520px) {

            .content {
                left: 22px;
                top: 20vh;

                width: 88vw;
            }

            .wordmark {
                width: 82vw;
            }

            .wordmark-text {
                font-size: 138px;
            }

            .copy {
                font-size: 16px;
            }

            .signup-block {
                margin-top: 30px;
                max-width: 86vw;
            }

            .signup-copy {
                font-size: 17px;
                margin-bottom: 14px;
            }

            .signup-form {
                flex-direction: column;
                gap: 7px;
                max-width: 86vw;
            }

            .signup-input,
            .signup-submit {
                width: 100%;
                min-height: 44px;
            }

            .mystic-form {
                /* Mobile: the mask becomes a quiet background motif instead
                   of competing with the signup form. */
                z-index: 2;

                width: 62vw;
                height: 52vh;

                right: -24vw;
                top: 46vh;

                --ink: #77736b;
                opacity: 0.34;
                mix-blend-mode: multiply;
            }

            .waves {
                height: 17vh;
            }
        }


        @media (
            prefers-reduced-motion:
            reduce
        ) {

            .wave-track,
            .wave-layer,
            .mystic-form,
            .fish-eye,
            .fish-tail-wrap,
            .fish-tail {
                animation: none !important;
            }

            .fish-tail-wrap {
                opacity: 0;
                transform: scaleX(0);
            }
        }

    </style>
</head>


<body>

<main class="page">


    <div class="paper-noise"></div>


    <!-- MAIN -->

    <section class="content">


        <svg
            class="wordmark"
            viewBox="0 0 700 205"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="Kaisku"
        >

            <defs>

                <filter
                    id="ink-distortion"
                    x="-10%"
                    y="-20%"
                    width="120%"
                    height="140%"
                >

                    <feTurbulence
                        type="fractalNoise"
                        baseFrequency="0.016 0.05"
                        numOctaves="2"
                        seed="7"
                        result="noise"
                    />

                    <feDisplacementMap
                        in="SourceGraphic"
                        in2="noise"
                        scale="3.2"
                        xChannelSelector="R"
                        yChannelSelector="G"
                    />

                </filter>

            </defs>


            <text
                class="wordmark-text"
                x="2"
                y="164"
            >
                Kaisku
            </text>

        </svg>


        <div class="rule"></div>


        <p class="copy">
            Something new is taking shape.<br>
            More information coming soon.
        </p>

        <div class="signup-block">
            <p class="signup-copy">
                Be the first to hear when<br>
                Kaisku comes to life.
            </p>

            <form
                class="signup-form"
                action="https://app.kit.com/forms/9807890/subscriptions"
                method="post"
            >
                <input
                    class="signup-input"
                    name="email_address"
                    type="email"
                    autocomplete="email"
                    inputmode="email"
                    aria-label="Email address"
                    placeholder="Email address"
                    required
                >

                <button
                    class="signup-submit"
                    type="submit"
                >
                    Notify me
                </button>
            </form>

            <div class="signup-meta">
                <a
                    href="https://kit.com/features/forms?utm_campaign=poweredby&amp;utm_content=form&amp;utm_medium=referral&amp;utm_source=dynamic"
                    target="_blank"
                    rel="nofollow noopener"
                >
                    Built with Kit
                </a>

                <span class="signup-meta-separator" aria-hidden="true"></span>

                <a href="/privacy/">
                    Privacy
                </a>
            </div>
        </div>

    </section>



    <!-- ========================================
         SKI MASK
         Vasen silmäreikä on peitetty.
    ======================================== -->

    <div
        class="mystic-form"
        aria-hidden="true"
    >

        <svg
            viewBox="0 0 320 470"
            xmlns="http://www.w3.org/2000/svg"
            preserveAspectRatio="xMidYMid meet"
        >

            <!-- Maskin siluetti -->
            <path
                fill="var(--ink)"
                d="
                    M160 20

                    C111 20
                     81 49
                     72 94

                    C65 129
                     66 170
                     69 205

                    C72 235
                     81 257
                     91 279

                    C101 301
                     101 322
                     93 343

                    C84 366
                     60 376
                     47 391

                    C34 406
                     42 425
                     59 439

                    C85 460
                     118 468
                     160 468

                    C202 468
                     235 460
                     261 439

                    C278 425
                     286 406
                     273 391

                    C260 376
                     236 366
                     227 343

                    C219 322
                     219 301
                     229 279

                    C239 257
                     248 235
                     251 205

                    C254 170
                     255 129
                     248 94

                    C239 49
                     209 20
                     160 20

                    Z
                "
            />

            <!--
                Oikea silmäreikä toimii animaation kalan vartalona.
                Kun pyrstö on piilossa, muoto näyttää täsmälleen
                tavalliselta silmäaukolta.
            -->
            <g class="fish-eye">

                <!--
                    Yksiosainen pyrstö piirretään ensin rungon ALLE.
                    Pyrstön tyvi ulottuu syvälle rungon sisään, joten
                    mustaa rakoa ei voi syntyä rungon ja pyrstön väliin
                    edes pyrstön liikkuessa.
                -->
                <g class="fish-tail-wrap">
                    <path
                        class="fish-tail"
                        d="
                            M216 146

                            C232 145
                             246 149
                             256 156

                            C266 149
                             278 145
                             290 147

                            C284 153
                             279 158
                             279 161

                            C281 166
                             286 171
                             292 177

                            C279 175
                             267 170
                             256 164

                            C246 171
                             232 174
                             216 171

                            C224 165
                             224 153
                             216 146

                            Z
                        "
                    />
                </g>

                <!--
                    Eye-shaped fish body is rendered on top of the tail root.
                    This masks the hinge completely and keeps the silhouette
                    continuous, like a single fish figure.
                -->
                <path
                    class="fish-eye-body"
                    d="
                        M183 151

                        C202 140
                         226 140
                         244 150

                        C235 170
                         213 179
                         192 172

                        C185 169
                         181 161
                         183 151

                        Z
                    "
                />

            </g>

            <!-- Suuaukko -->
            <ellipse
                cx="159"
                cy="250"
                rx="32"
                ry="18"
                fill="var(--paper)"
            />

        </svg>

    </div>



    <!-- ========================================
         WAVES
    ======================================== -->

    <div
        class="waves"
        aria-hidden="true"
    >


        <!-- BACK -->

        <div class="wave-layer wave-a">

            <div class="wave-track">


                <div class="wave-copy">

                    <svg
                        viewBox="0 0 1500 320"
                        preserveAspectRatio="none"
                    >
                        <path
                            d="
                                M0 320
                                L0 145

                                C170 102
                                 330 192
                                 500 145

                                C675 97
                                 835 192
                                 1000 145

                                C1170 100
                                 1330 188
                                 1500 145

                                L1500 320
                                Z
                            "
                        />
                    </svg>

                </div>


                <div class="wave-copy">

                    <svg
                        viewBox="0 0 1500 320"
                        preserveAspectRatio="none"
                    >
                        <path
                            d="
                                M0 320
                                L0 145

                                C170 102
                                 330 192
                                 500 145

                                C675 97
                                 835 192
                                 1000 145

                                C1170 100
                                 1330 188
                                 1500 145

                                L1500 320
                                Z
                            "
                        />
                    </svg>

                </div>


            </div>

        </div>



        <!-- SECOND -->

        <div class="wave-layer wave-b">

            <div class="wave-track">
